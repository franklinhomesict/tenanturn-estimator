<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TenanTurn Executive Dashboard</title>
    <style>
      .logo { width: 96px !important; height: 96px !important; }
      @media (max-width: 680px) {
        .logo { width: 78px !important; height: 78px !important; }
        tr.scan-row{position:relative;padding:13px 12px 12px!important;border:1px solid #303947!important;border-left-width:5px!important;border-radius:13px!important;background:#141922!important;margin-bottom:12px!important}
        tr.scan-neutral{border-left-color:#788597!important}
        tr.scan-blue{border-left-color:#6ab7ff!important}
        tr.scan-green{border-left-color:#52d28c!important}
        tr.scan-yellow{border-left-color:#ffd166!important}
        tr.scan-red{border-left-color:#ff6b6b!important}
        tr.scan-orange{border-left-color:#f3a95f!important}
        tr.scan-row td[data-label="Job"],tr.scan-row td[data-label="Vendor"],tr.scan-row td[data-label="PM / Client"]{font-size:18px!important;line-height:1.2;font-weight:850;padding-top:3px!important;padding-bottom:8px!important;color:#f3f6fa!important}
        tr.scan-row td[data-label="Job"]::before,tr.scan-row td[data-label="Vendor"]::before,tr.scan-row td[data-label="PM / Client"]::before{display:none!important}
        tr.scan-row td[data-label="Stage"],tr.scan-row td[data-label="Audit Status"],tr.scan-row td[data-label="Doc Status"]{display:inline-flex!important;width:auto!important;border-radius:999px;padding:5px 9px!important;margin:0 6px 8px 0;font-size:12px;font-weight:850;letter-spacing:.02em;background:#1a2532;color:#9ecbfa}
        tr.scan-green td[data-label="Stage"],tr.scan-green td[data-label="Audit Status"],tr.scan-green td[data-label="Doc Status"]{background:#102c20;color:#62dfa0}
        tr.scan-yellow td[data-label="Stage"],tr.scan-yellow td[data-label="Audit Status"],tr.scan-yellow td[data-label="Doc Status"]{background:#33290e;color:#ffd166}
        tr.scan-red td[data-label="Stage"],tr.scan-red td[data-label="Audit Status"],tr.scan-red td[data-label="Doc Status"]{background:#341618;color:#ff8c8c}
        tr.scan-orange td[data-label="Stage"],tr.scan-orange td[data-label="Audit Status"],tr.scan-orange td[data-label="Doc Status"]{background:#342313;color:#ffc17c}
        tr.scan-neutral td[data-label="Stage"]{background:#252d38;color:#d7dee8}
        tr.scan-row td[data-label="Stage"]::before,tr.scan-row td[data-label="Audit Status"]::before,tr.scan-row td[data-label="Doc Status"]::before{display:none!important}
        tr.scan-row td[data-label="Next Action"],tr.scan-row td[data-label="Closeout Next"]{margin-top:8px;padding:9px 10px!important;border-radius:9px;background:#101a28;border:1px solid #2f4258;font-size:15px;font-weight:800}
        tr.scan-row td[data-label="Next Action"]::before{content:"NEXT"!important;display:block!important;margin-bottom:3px;color:#7fa8d3!important;font-size:9px!important;font-weight:900;letter-spacing:.08em}
        tr.scan-row td[data-label="Closeout Next"]::before{content:"NEXT"!important;display:block!important;margin-bottom:3px;color:#7fa8d3!important;font-size:9px!important;font-weight:900;letter-spacing:.08em}
        tr.scan-row td[data-label="Value"],tr.scan-row td[data-label="Approved Unbilled"],tr.scan-row td[data-label="Remaining WO $"],tr.scan-row td[data-label="Final GP"],tr.scan-row td[data-label="Projected / Final GP"]{font-size:16px;font-weight:800}
        .scan-tag{display:inline-flex;align-items:center;width:auto;border:1px solid #3b4656;border-radius:999px;padding:4px 8px;margin:0 0 8px 6px;color:#b9c6d7;font-size:10px;font-weight:850;letter-spacing:.06em}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (()=>{
        const toneFrom=(txt='')=>{const s=txt.toLowerCase();if(/critical|blocked|true loss|lost|denied/.test(s))return'scan-red';if(/review|follow-up|pending|learning/.test(s))return'scan-yellow';if(/wip|in progress|reconciled|won|approved|recorded|ready to close/.test(s))return'scan-green';if(/assigned|not started|provisional|work open/.test(s))return'scan-blue';if(/complete|closeout|ready to bill|pay vendors/.test(s))return'scan-orange';return'scan-neutral'};
        const byHeading=(name)=>{const h=[...document.querySelectorAll('h3')].find(x=>x.textContent.trim()===name);return h?.closest('.card')||null};
        const lineTag=()=>{const t=document.querySelector('.biznav button.on')?.textContent?.trim();return t==='Make Ready'?'MR':t==='Contractor Services'?'CS':''};
        const styleRows=(card,kind)=>{if(!card)return;card.querySelectorAll('tbody tr').forEach(row=>{row.classList.add('scan-row');row.classList.remove('scan-neutral','scan-blue','scan-green','scan-yellow','scan-red','scan-orange');let probe='';if(kind==='ops')probe=row.querySelector('td[data-label="Stage"]')?.textContent||'';else if(kind==='finance')probe=`${row.querySelector('td[data-label="Audit Status"]')?.textContent||''} ${row.querySelector('td[data-label="Closeout Next"]')?.textContent||''}`;else if(kind==='loss')probe='true loss';else if(kind==='win')probe='won';else if(kind==='pending')probe='pending';else if(kind==='follow')probe='follow-up';else if(kind==='people')probe=row.textContent||'';row.classList.add(toneFrom(probe));row.querySelectorAll('.scan-tag').forEach(x=>x.remove());if(kind==='ops'){const stage=row.querySelector('td[data-label="Stage"]');const tag=lineTag();if(stage&&tag){const b=document.createElement('span');b.className='scan-tag';b.textContent=tag;stage.insertAdjacentElement('afterend',b)}}})};
        const enhance=()=>{if(!window.matchMedia('(max-width: 680px)').matches)return;styleRows(byHeading('Current Work Through Closeout'),'ops');styleRows(byHeading('New Wins'),'win');styleRows(byHeading('True Losses'),'loss');styleRows(byHeading('Pending New — Current'),'pending');styleRows(byHeading('Decision Follow-up'),'follow');styleRows(byHeading('Vendor Capacity + Final Economics'),'people');styleRows(byHeading('Client / PM Scorecard'),'people');styleRows(byHeading('Job Economics & Closeout'),'finance')};
        setInterval(enhance,500);document.addEventListener('click',()=>setTimeout(enhance,25));window.addEventListener('load',enhance);
      })();
    </script>
  </body>
</html>
